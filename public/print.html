<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>笔记打印</title>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #1f2329; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 12.5px; line-height: 1.75; }
  #doc { max-width: 780px; margin: 0 auto; padding: 10px 6px 40px; }
  h1 { font-size: 20px; margin: 0 0 10px; border-bottom: 2px solid #1a54c8; padding-bottom: 6px; }
  h2 { font-size: 15.5px; margin: 20px 0 8px; color: #1a54c8; break-after: avoid; }
  h3 { font-size: 13.5px; margin: 16px 0 6px; break-after: avoid; }
  p { margin: 6px 0; }
  ul, ol { margin: 6px 0 6px 1.4em; padding: 0; }
  li { margin: 3px 0; break-inside: avoid; }
  blockquote { margin: 8px 0; padding: 6px 12px; border-left: 3px solid #1a54c8; background: #f5f7fb; color: #444; }
  code { background: #f0f2f5; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
  pre { background: #f6f7f9; padding: 10px; border-radius: 6px; white-space: pre-wrap; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0; }
  th, td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; }
  sup.page-ref { color: #1a54c8; font-weight: 600; }
  details { margin: 8px 0; padding: 8px 10px; border: 1px solid #e3e6eb; border-radius: 8px; background: #fafbfc; break-inside: avoid; }
  details summary { font-weight: 600; }
  .err { color: #c0392b; }
  @media print { a { color: inherit; text-decoration: none; } }
</style>
</head>
<body>
<article id="doc"><p>加载中…</p></article>
<script src="/vendor/marked/marked.umd.js"></script>
<script src="/vendor/katex/katex.min.js"></script>
<script src="/vendor/katex/contrib/auto-render.min.js"></script>
<script>
(async () => {
  const doc = document.getElementById('doc');
  try {
    const dir = new URLSearchParams(location.search).get('dir') || '';
    if (!dir) throw new Error('缺少 dir 参数');
    const courseDir = dir.split('/').slice(0, -1).join('/');
    const noteUrl = '/notes/' + dir.split('/').map(encodeURIComponent).join('/') + '.note.md';
    const res = await fetch(noteUrl, { cache: 'no-store' });
    if (!res.ok) throw new Error('读取笔记失败：HTTP ' + res.status);
    let md = await res.text();
    md = md.replace(/<!--[\s\S]*?-->/g, '');   // 去掉页标记等内部注释
    // wiki 页码角标 → markdown 链接（下面再转成上标）；其他 wiki 链接落成文字
    md = md.replace(/\[\[([^\]]*?)#page=(\d+)\|([^\]]*)\]\]/g, (m, file, page) => `[${page}](#page=${page})`);
    md = md.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, target, label) => label || target.split('#')[0]);
    const parse = (marked.parse ? marked.parse.bind(marked) : marked);
    doc.innerHTML = parse(md);
    // [[xx.pdf#page=N|N]] → 上标 [N]
    doc.querySelectorAll('a').forEach((a) => {
      const m = /#page=(\d+)/.exec(a.getAttribute('href') || '');
      if (!m) return;
      const sup = document.createElement('sup');
      sup.className = 'page-ref';
      sup.textContent = ' [' + m[1] + ']';
      a.replaceWith(sup);
    });
    // 相对图片资源 → /notes/<课程>/ 下解析
    doc.querySelectorAll('img[src]').forEach((img) => {
      const src = img.getAttribute('src') || '';
      if (!src || /^([a-z][a-z0-9+.-]*:|\/\/|\/|#|data:)/i.test(src)) return;
      img.src = '/notes/' + courseDir.split('/').map(encodeURIComponent).join('/') + '/' + src.split('/').map(encodeURIComponent).join('/');
    });
    // 习题答案全部展开（打印不需要折叠）
    doc.querySelectorAll('details').forEach((d) => { d.open = true; });
    if (window.renderMathInElement) {
      renderMathInElement(doc, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false },
        ],
        throwOnError: false,
      });
    }
    document.title = (dir.split('/').pop() || '笔记') + ' · 打印';
  } catch (e) {
    doc.innerHTML = '<p class="err">' + String(e.message || e) + '</p>';
  }
  window.__noteReady = true;
})();
</script>
</body>
</html>
